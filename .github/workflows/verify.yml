name: Verify public presentation boundary
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check sw.js
      - run: node tests/privacy.cjs
      - run: node tests/session-races.cjs
      - run: node tests/risk-controls.cjs
